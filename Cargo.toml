[package]
name = "eighty-one"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["lostbymidnight"]
description = "The official interpreter for the 81 esolang"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lostbymidnight/81"
homepage = "https://esolangs.org/wiki/81"
keywords = ["esolang", "interpreter", "esoteric", "base81"]
categories = ["command-line-utilities", "compilers"]
exclude = [".github", ".gitattributes", ".gitignore"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "81"
path = "src/main.rs"
